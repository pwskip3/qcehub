apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcehub-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qcehub-backend
  template:
    metadata:
      labels:
        app: qcehub-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub-user/qcehub-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: "postgres://qceuser:qcepass@qce-postgres:5432/qcehub"
            - name: REDIS_URL
              value: "redis://qce-redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcehub-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qcehub-frontend
  template:
    metadata:
      labels:
        app: qcehub-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-user/qcehub-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://qcehub-backend:3001"
