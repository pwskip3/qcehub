apiVersion: v1
kind: Service
metadata:
  name: qcehub-backend-service
spec:
  type: LoadBalancer
  selector:
    app: qcehub-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: qcehub-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: qcehub-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
